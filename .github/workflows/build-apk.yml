name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Utwórz GitHub Release z plikiem APK'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Tag wersji dla Release (np. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or verify signing keystore
        run: |
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring persistent debug.keystore from debug.keystore.base64"
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine Version and Code
        id: version_info
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}" = "true" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="v1.0.2"
          fi
          CLEAN_TAG="${TAG#v}"
          CLEAN_TAG="${CLEAN_TAG#V}"
          
          # Calculate strictly increasing integer versionCode
          COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3 | grep -o '^[0-9]\+' || echo 0)
          
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-2}
          
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$CODE" -lt 10002 ]; then
            CODE=$(( 10000 + COMMITS ))
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          echo "version_code=${CODE}" >> $GITHUB_OUTPUT
          echo "Version Name: ${CLEAN_TAG}, Version Code: ${CODE}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PcustomVersionName="${{ steps.version_info.outputs.clean_tag }}" \
            -PcustomVersionCode="${{ steps.version_info.outputs.version_code }}" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rBiblia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)) && steps.version_info.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ steps.version_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

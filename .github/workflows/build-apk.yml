name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Utwórz GitHub Release z plikiem APK'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Tag wersji dla Release (np. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or generate signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring persistent debug.keystore from debug.keystore.base64"
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}" = "true" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG=""
          fi
          CLEAN_TAG="${TAG#v}"
          CLEAN_TAG="${CLEAN_TAG#V}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if [ -n "${{ steps.release_tag.outputs.clean_tag }}" ]; then
            ./gradlew assembleDebug -PcustomVersionName="${{ steps.release_tag.outputs.clean_tag }}" --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rBiblia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)) && steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
